<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crop Recommendation System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Crop Recommendation System</h1>
            <p>Enter the soil and environmental conditions to get a suitable crop recommendation.</p>
        </div>

        <div class="form-box">

            <h2>Enter Crop Conditions</h2>

            <form action="/predict" method="POST">

                <div class="input-group">
                    <label for="nitrogen">Nitrogen (N)</label>
                    <input type="number" id="nitrogen" name="nitrogen"
                           step="any" placeholder="Enter nitrogen value" required>
                </div>

                <div class="input-group">
                    <label for="phosphorus">Phosphorus (P)</label>
                    <input type="number" id="phosphorus" name="phosphorus"
                           step="any" placeholder="Enter phosphorus value" required>
                </div>

                <div class="input-group">
                    <label for="potassium">Potassium (K)</label>
                    <input type="number" id="potassium" name="potassium"
                           step="any" placeholder="Enter potassium value" required>
                </div>

                <div class="input-group">
                    <label for="temperature">Temperature (°C)</label>
                    <input type="number" id="temperature" name="temperature"
                           step="any" placeholder="Enter temperature" required>
                </div>

                <div class="input-group">
                    <label for="humidity">Humidity (%)</label>
                    <input type="number" id="humidity" name="humidity"
                           step="any" placeholder="Enter humidity" required>
                </div>

                <div class="input-group">
                    <label for="ph">Soil pH</label>
                    <input type="number" id="ph" name="ph"
                           step="any" placeholder="Enter soil pH" required>
                </div>

                <div class="input-group">
                    <label for="rainfall">Rainfall (mm)</label>
                    <input type="number" id="rainfall" name="rainfall"
                           step="any" placeholder="Enter rainfall" required>
                </div>

                <button type="submit">Recommend Crop</button>

            </form>

            {% if prediction %}
            <div class="result">
                <h3>Recommended Crop</h3>
                <p>{{ prediction }}</p>
            </div>
            {% endif %}

        </div>

    </div>

</body>
</html>
